<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
            <h3>Register</h3>
            <form action="/register" method="post">
                <label for = "user_name" class="form-label">Name:</label>
                <input type="text" id="user_name" name="user_name" class="form-control" required><br>

                <label for="user_email" class="form-label">Email ID:</label>
                <input type="email" id="user_email" name="user_email" class="form-control" required><br>

                <label for="user_password" class="form-label">Password:</label>
                <input type="password" id="user_password" name="user_password" class="form-control" required><br>

                <label for="user_confirm_password" class="form-label">Confirm Password:</label>
                <input type="password" id="user_confirm_password" name="user_confirm_password" class="form-control" required><br>

                <label for="role">I am a:</label>
                <input type="radio" name="role" value="user" required> Trekker
                <input type="radio" name="role" value="trek_staff" required> Trek staff<br><br>

                <input type="submit" value="Register">
            </form>

            <p>Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</body>
</html>
