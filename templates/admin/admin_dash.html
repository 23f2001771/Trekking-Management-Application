{% extends "admin/admin_base.html" %}
{% block content %}
<h1>Trekking Management Application</h1>
<table>
    <thead>
        <tr>
            <th>Total Treks</th>
            <th>Total Users</th>
            <th>Total Staff</th>
            <th>Total Bookings</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>{{ stats.total_treks }}</td>
            <td>{{ stats.total_users }}</td>
            <td>{{ stats.total_staff }}</td>
            <td>{{ stats.total_bookings }}</td>
        </tr>
    </tbody>
</table>
{% endblock %}
